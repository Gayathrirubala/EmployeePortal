<h2>Employees</h2>

   <button mat-flat-button color="primary" id="empyAddBtn">
    <mat-icon>add</mat-icon>
    Add Employee
  </button>
  <mat-form-field appearance="outline" class="empSearchBox">
    <mat-label>Search Employee</mat-label>
    <input matInput placeholder="Type here .."  #searchInput (input)="onSearch(searchInput.value)">
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>


    <table mat-table [dataSource]="paginatedEmployees()" class="mat-elevation-z8">

    <!--- Note that these columns can be defined in any order.
            The actual rendered columns are set as a property on the row definition" -->

    <ng-container matColumnDef="image">
        <th mat-header-cell *matHeaderCellDef> Photo </th>
        <td mat-cell *matCellDef="let element"> 
            <img [src]="element.image" alt="Profile" class="avatar">
        </td>
    </ng-container>

    <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let element"> {{element.username}} </td>
    </ng-container>

    <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef> Email </th>
        <td mat-cell *matCellDef="let element"> {{element.email}} </td>
    </ng-container>

    <ng-container matColumnDef="department">
        <th mat-header-cell *matHeaderCellDef> Department </th>
        <td mat-cell *matCellDef="let element"> {{element.company.department}} </td>
    </ng-container>
     <ng-container matColumnDef="designation">
        <th mat-header-cell *matHeaderCellDef> Designation  </th>
        <td mat-cell *matCellDef="let element"> {{element.company.title}} </td>
    </ng-container>
     <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Action  </th>
        <td mat-cell *matCellDef="let element"> 
            <ng-container class="action-buttons">
            <button mat-icon-button aria-label="View Employee" (click)="viewEmployee(element.id)" ><mat-icon>visibility</mat-icon> </button>
            <button mat-icon-button color = "primary" aria-label="Edit Employee" ><mat-icon>edit</mat-icon> </button>
            <button mat-icon-button color="warn" aria-label="Delete Employee" ><mat-icon>delete</mat-icon> </button>
      
            </ng-container>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <mat-paginator
    [length]="filteredEmployee().length"
    [pageSize]="pageSize()"
    [pageSizeOptions]="[5,10,20,50]"
    [pageIndex]="pageIndex()"
    (page)="onPageChange($event)"
    showFirstLastButtons>
    </mat-paginator>
